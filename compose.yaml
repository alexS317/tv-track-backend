services:
  postgres:
    image: 'postgres:latest'
    container_name: tv-track-db
    environment:
      - 'POSTGRES_DB=tv_track'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=root'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: